
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SISTEMA DE REGISTRO DE VENDAS OPERAÇÕES COM VINHOS VALITRANSFERS LTDA</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>
            SISTEMA DE REGISTRO DE VENDAS<br>
            OPERAÇÕES COM VINHOS VALITRANSFERS LTDA
        </h1>

        <form action="/salvar" method="POST">

            <div class="campo">

                <label>Tipo de vinho</label>

                <input
                    type="text"
                    name="tipo"
                    placeholder="Ex.: Tinto"
                    required>

            </div>

            <div class="campo">

                <label>Marca</label>

                <input
                    type="text"
                    name="marca"
                    placeholder="Ex.: Miolo"
                    required>

            </div>

            <div class="campo">

                <label>Preço</label>

                <input
                    type="number"
                    step="0.01"
                    min="0"
                    name="preco"
                    placeholder="0.00"
                    required>

            </div>

            <div class="campo">

                <label>Quantidade Vendida</label>

                <input
                    type="number"
                    min="1"
                    name="quantidade"
                    placeholder="0"
                    required>

            </div>

            <button type="submit" class="salvar">
                Salvar Venda
            </button>

        </form>

        <hr>

        <h2>Registro de Vendas</h2>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Tipo de Vinho</th>
                    <th>Marca</th>
                    <th>Preço (R$)</th>
                    <th>Quantidade Vendida</th>

                </tr>

            </thead>

            <tbody>

                {% for venda in vendas %}

                <tr>

                    <td>{{ venda[0] }}</td>
                    <td>{{ venda[1] }}</td>
                    <td>{{ venda[2] }}</td>
                    <td>R$ {{ "%.2f"|format(venda[3]) }}</td>
                    <td>{{ venda[4] }}</td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

        <div class="botoes">

            <a href="/csv">
                <button type="button" class="csv">
                    Gerar Consulta em CSV
                </button>
            </a>

        </div>

    </div>

</body>

</html>
